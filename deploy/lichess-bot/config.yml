# lichess-bot config for rustfish. The token comes from the LICHESS_BOT_TOKEN
# env var (dokku config:set), never from this file.
# Full option reference: config.yml.default in lichess-bot-devs/lichess-bot.
token: ""
url: "https://lichess.org/"

engine:
  dir: "./engines/"
  name: "rustfish"
  protocol: "uci"
  ponder: false                  # rustfish has no ponder support
  polyglot:
    enabled: false
  draw_or_resign:
    resign_enabled: true
    resign_score: -1000
    resign_for_egtb_minus_two: true
    resign_moves: 5
    offer_draw_enabled: true
    offer_draw_score: 0
    offer_draw_for_egtb_zero: true
    offer_draw_moves: 10
    offer_draw_pieces: 10
  online_moves:
    max_out_of_book_moves: 10
    max_retries: 2
    chessdb_book:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    lichess_opening_explorer:
      enabled: false
    online_egtb:
      enabled: false
  lichess_bot_tbs:
    syzygy:
      enabled: false
    gaviota:
      enabled: false
  uci_options:                   # only options rustfish actually exposes
    Hash: 64
    Threads: 1
    OwnBook: true                # built-in book keeps openings varied
  silence_stderr: false

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 1000              # server-to-lichess latency allowance (ms)
max_takebacks_accepted: 0
quit_after_all_games_finish: false

correspondence:
  move_time: 60
  checkin_period: 300
  disconnect_time: 150
  ponder: false

challenge:
  concurrency: 1                 # 2-core shared server: one game at a time
  games_reserved_for_humans: 0
  sort_by: "best"
  preference: "none"
  accept_bot: true
  only_bot: false
  max_increment: 20
  min_increment: 0
  max_base: 900
  min_base: 60
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    - casual
    - rated
  bullet_requires_increment: true
  max_simultaneous_games_per_user: 1

greeting:
  hello: "Hi! I'm {me}, a from-scratch Rust engine. Good luck!"
  goodbye: "Good game!"
  hello_spectators: "Hi! I'm {me}, a from-scratch Rust engine."
  goodbye_spectators: "Thanks for watching!"

matchmaking:
  allow_matchmaking: true        # challenge other bots when idle
  allow_during_games: false
  challenge_variant: "standard"
  challenge_timeout: 5           # minutes idle before sending a challenge
  challenge_initial_time:
    - 180
    - 300
  challenge_increment:
    - 2
    - 3
  opponent_rating_difference: 300
  rating_preference: "none"
  challenge_mode: "rated"
  challenge_filter: "coarse"
  include_challenge_block_list: false
