[package]
name = "rustfish"
version = "0.1.0"
edition = "2021"

[features]
# Search statistics for diagnosis (docs/search-diagnosis-2026-11-19.md).
stats = []
# Also re-search a sample of pruned nodes/moves to estimate pruning error rates.
stats-verify = ["stats"]
# Env knobs only (no counters), for fixed-node games of diagnosis variants.
knobs = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
