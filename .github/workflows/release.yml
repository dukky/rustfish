name: Release

# Builds the downloadable engine binaries, smoke-tests each one where the
# runner can execute it (uci, perfttest, bench node count equal to the newest
# `Bench:` trailer), and uploads them as workflow artifacts.
#
# - Tag `v*` push: also drafts a GitHub release with every binary and a
#   SHA256SUMS file attached. The release stays a DRAFT; the owner reviews and
#   publishes it by hand.
# - Manual dispatch: artifacts only; never creates a release or a tag.
#   `measure_tiers` adds a job that times an x86-64-v4 build against v3 on
#   AVX-512 runners (the v4 tier ships only if it measures faster).
#
# The engine name comes from Cargo.toml's `[package] name`, so a rename is a
# one-line change there. Files are named <name>-<version>-<os>-<tier>[.exe].
# See README.md ("Download and run") and docs/ccrl-submission.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version used in file names (default: Cargo.toml version + short sha). No release is created."
        default: ""
      nps_ab:
        description: "TEMP: Windows vs Linux NPS A/B of abl4-ctlA vs abl4-h15"
        type: boolean
        default: false
      measure_tiers:
        description: "Also time an x86-64-v4 build against v3 on AVX-512 runners"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.tier }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 tiers. v3 (AVX2/BMI2) is the main build; AVX-512 and VNNI
          # kernels are picked at runtime, so v3 already uses them where present.
          # No v4 tier: on 4 AVX-512 runners (2x EPYC 9V74 Zen 4, 2x 9V45 Zen 5,
          # 27 Nov 2026, bench 15, 10 interleaved rounds) v4 was +0.4..+1.7% over
          # v3 against an A/A of -0.6..+0.6%, i.e. ~+0.75%: not worth a binary
          # that crashes on CPUs without AVX-512.
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc,    os: windows, tier: x86-64-v2, cpu: x86-64-v2, ext: .exe }
          - { runner: windows-latest,   target: x86_64-pc-windows-msvc,    os: windows, tier: x86-64-v3, cpu: x86-64-v3, ext: .exe }
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  os: linux,   tier: x86-64-v2, cpu: x86-64-v2, ext: "" }
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  os: linux,   tier: x86-64-v3, cpu: x86-64-v3, ext: "" }
          # ARM: NEON (and dotprod where the CPU reports it) need no tiers.
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os: linux,   tier: aarch64,   cpu: "",        ext: "" }
          - { runner: macos-latest,     target: aarch64-apple-darwin,      os: macos,   tier: arm64,     cpu: "",        ext: "" }
          # Intel Macs: every Mac that runs a supported macOS has AVX2.
          - { runner: macos-15-intel,   target: x86_64-apple-darwin,       os: macos,   tier: x86-64,    cpu: x86-64-v3, ext: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_bench.py reads the newest Bench: trailer

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Name and version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          cargo_ver=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$cargo_ver-dev-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$name $version"

      - name: Build
        env:
          CPU: ${{ matrix.cpu }}
          TARGET: ${{ matrix.target }}
        run: |
          flags=""
          if [ -n "$CPU" ]; then flags="-C target-cpu=$CPU"; fi
          # The engine runs its UCI loop on an 8 MB thread; the larger MSVC
          # main-thread stack (default 1 MB) is a belt-and-braces extra.
          if [[ "$TARGET" == *windows-msvc ]]; then flags="$flags -C link-arg=/STACK:8388608"; fi
          echo "RUSTFLAGS=$flags"
          RUSTFLAGS="$flags" cargo build --release --target "$TARGET"

      - name: Name binary
        id: bin
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          OS: ${{ matrix.os }}
          TIER: ${{ matrix.tier }}
          EXT: ${{ matrix.ext }}
          TARGET: ${{ matrix.target }}
        run: |
          base="$NAME-$VERSION-$OS-$TIER$EXT"
          mkdir -p dist
          cp "target/$TARGET/release/$NAME$EXT" "dist/$base"
          echo "file=dist/$base" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: CPU
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep 'Model name'; grep -o -w -E 'avx2|avx512bw|avx512_vnni|avx_vnni|asimddp' /proc/cpuinfo | sort -u | tr '\n' ' '; echo ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
          esac

      - name: UCI smoke
        env:
          BIN: ${{ steps.bin.outputs.file }}
        run: |
          out=$(printf 'uci\r\nisready\r\nposition startpos\r\ngo depth 8\r\nquit\r\n' | "./$BIN" | tr -d '\r')
          echo "$out" | grep -E '^id |uciok|readyok|bestmove'
          grep -q '^uciok' <<<"$out"
          grep -q '^readyok' <<<"$out"
          grep -qE '^bestmove [a-h][1-8][a-h][1-8]' <<<"$out"

      - name: Perft
        env:
          BIN: ${{ steps.bin.outputs.file }}
        run: |
          out=$(printf 'perfttest\nquit\n' | "./$BIN" | tr -d '\r')
          echo "$out" | tail -3
          grep -qE 'perfttest summary ([0-9]+)/\1 passed' <<<"$out"

      - name: Bench (must equal the Bench trailer)
        env:
          BIN: ${{ steps.bin.outputs.file }}
          BASE: ${{ steps.bin.outputs.base }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/check_bench.py --engine "./$BIN"
          out=$(printf 'bench\nquit\n' | "./$BIN" | tr -d '\r')
          nodes=$(sed -n 's/^Nodes searched *: *//p' <<<"$out")
          nps=$(sed -n 's/^Nodes\/second *: *//p' <<<"$out")
          simd=$(sed -n 's/^NNUE SIMD *: *//p' <<<"$out")
          echo "| \`$BASE\` | $nodes | $nps | $simd |" > "dist/$BASE.bench.md"
          echo "### $BASE: bench $nodes nodes, $nps nps, SIMD $simd" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bin.outputs.base }}
          path: dist/
          if-no-files-found: error

  # Should an x86-64-v4 (AVX-512 at compile time) build ship next to v3? Both
  # are built on one AVX-512 runner, checked for identical bench nodes, and
  # timed interleaved with an A/A copy of v3. Several shards because the
  # runner CPU model varies; shards without AVX-512 report and skip.
  tiers:
    if: github.event_name == 'workflow_dispatch' && inputs.measure_tiers
    name: tiers-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Build v3 and v4, time them
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CPU: $model"
          if ! grep -qw avx512bw /proc/cpuinfo; then
            echo "### shard ${{ matrix.shard }}: $model has no AVX-512, skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release --target-dir t3
          RUSTFLAGS="-C target-cpu=x86-64-v4" cargo build --release --target-dir t4
          cp "t3/release/$name" v3; cp "t3/release/$name" v3copy; cp "t4/release/$name" v4
          python3 - "$model" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, statistics, subprocess, sys
          bins, rounds = ["v3", "v4", "v3copy"], 10
          def bench(b):
              out = subprocess.run(["taskset", "-c", "1", "./" + b], input="bench 15\nquit\n",
                                   capture_output=True, text=True, check=True).stdout
              n = int(re.search(r"Nodes searched\s*:\s*(\d+)", out).group(1))
              s = re.search(r"NNUE SIMD\s*:\s*(\S+)", out).group(1)
              return n, int(re.search(r"Nodes/second\s*:\s*(\d+)", out).group(1)), s
          nps = {b: [] for b in bins}
          nodes, simd = {}, {}
          for r in range(rounds):
              order = bins[r % 3:] + bins[:r % 3]
              for b in order:
                  n, v, s = bench(b)
                  nodes.setdefault(b, n); simd[b] = s
                  assert nodes[b] == n
                  nps[b].append(v)
          assert len(set(nodes.values())) == 1, nodes
          print(f"### {sys.argv[1]}: bench 15 = {nodes['v3']} nodes, {rounds} interleaved rounds")
          print("| binary | SIMD | median nps | median ratio to v3 | min..max |")
          print("|---|---|---|---|---|")
          for b in bins:
              ratios = [100 * (x / y - 1) for x, y in zip(nps[b], nps["v3"])]
              print(f"| {b} | {simd[b]} | {statistics.median(nps[b]):.0f} | {statistics.median(ratios):+.2f}% | {min(ratios):+.1f}..{max(ratios):+.1f} |")
          EOF

  diag-v2:
    if: github.event_name == 'workflow_dispatch' && inputs.measure_tiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Profile v2 vs v3
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) >/dev/null || sudo apt-get install -y -qq linux-tools-generic >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=-1
          lscpu | grep 'Model name'
          for c in x86-64-v2 x86-64-v3; do
            CARGO_PROFILE_RELEASE_STRIP=false CARGO_PROFILE_RELEASE_DEBUG=line-tables-only RUSTFLAGS="-C target-cpu=$c" cargo build --release --target-dir t-$c 2>&1 | tail -1
            for r in 1 2 3; do printf 'bench\nquit\n' | ./t-$c/release/rustfish | grep -E 'Nodes|SIMD'; done
            printf 'evalhash\nquit\n' | ./t-$c/release/rustfish | grep -i hash
          done
          P=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); P=${P:-perf}
          for c in x86-64-v2 x86-64-v3; do
            echo "=== $c"
            printf 'bench\nquit\n' > in.txt
            $P record -q -g -o p-$c.data ./t-$c/release/rustfish < in.txt > /dev/null
            $P report -i p-$c.data --no-children --sort sym --stdio 2>/dev/null | grep -v '^#' | grep -v '^$' | grep '%' | head -25
            $P report -i p-$c.data --no-children --sort srcline --stdio 2>/dev/null | grep '%' | grep -v '^#' | head -40
          done

  nps-ab:
    if: github.event_name == 'workflow_dispatch' && inputs.nps_ab
    name: nps-ab-${{ matrix.runner }}-${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build both refs (x86-64-v3)
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep 'Model name' | tee -a "$GITHUB_STEP_SUMMARY" ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          for ref in abl4-ctlA abl4-h15; do
            git worktree add -q "../w-$ref" "origin/$ref"
            name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' "../w-$ref/Cargo.toml" | head -1)
            (cd "../w-$ref" && RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release 2>&1 | tail -1)
            cp "../w-$ref/target/release/$name$ext" "$ref$ext"
          done
          cp "abl4-ctlA$ext" "abl4-ctlA-copy$ext"
          echo "EXT=$ext" >> "$GITHUB_ENV"
      - name: Interleaved A/B
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/nps_ab.py "h1024:./abl4-ctlA$EXT" "h1024-copy:./abl4-ctlA-copy$EXT" "h1536:./abl4-h15$EXT" | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Draft release (not published)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          {
            echo "$name $TAG ($GITHUB_SHA)"
            echo
            echo "UCI chess engine. Pick a binary (details in the README, \"Download and run\"):"
            echo
            echo "- \`x86-64-v3\`: AVX2/BMI2 (Intel Haswell 2013+, AMD Zen 1+). The one to use on most PCs."
            echo "  AVX-512 and VNNI are used automatically on CPUs that have them."
            echo "- \`x86-64-v2\`: older x86-64 CPUs without AVX2 (needs SSE4.2/POPCNT)."
            echo "- \`aarch64\` (Linux ARM64), \`macos-arm64\` (Apple Silicon), \`macos-x86-64\` (Intel Macs)."
            echo
            echo "Bench (\`bench\` UCI command; the node count is the build signature and must match across binaries):"
            echo
            echo "| Binary | Nodes | NPS (CI runner) | SIMD |"
            echo "|---|---|---|---|"
            cat artifacts/*.bench.md | sort
          } > notes.md
          cat notes.md
          rm artifacts/*.bench.md
          (cd artifacts && sha256sum * > SHA256SUMS)
          gh release create "$TAG" artifacts/* --draft --title "$name $TAG" --notes-file notes.md --verify-tag
