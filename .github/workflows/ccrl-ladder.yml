name: CCRL ladder

# Plays rustfish against CCRL-rated anchors (scripts/anchors.json) with
# fastchess and fits one CCRL Blitz-scale rating. Started by hand, or by the
# merge queue every few merges (`test_id` set): then the report job also
# appends the result to tests/ladder-log.jsonl on main and calls the queue back.

run-name: "CCRL ladder ${{ inputs.test_id }}"

on:
  workflow_dispatch:
    inputs:
      games_per_anchor:
        description: "Games per anchor (even; split across shards)"
        default: "96"
      tc:
        description: "fastchess time control (CCRL Blitz is 120+1)"
        default: "120+1"
      shards:
        description: "Parallel jobs per anchor"
        default: "2"
      anchors:
        description: "Comma-separated anchor names, or 'all'"
        default: "all"
      anchors_file:
        description: "Anchor list (scripts/anchors-high.json for 2300-2600)"
        default: "scripts/anchors.json"
      test_id:
        description: "Set by the merge queue: log the result and call the queue back"
        default: ""

permissions:
  contents: write   # append to tests/ladder-log.jsonl when started by the queue
  actions: write    # call the queue back

env:
  FASTCHESS_VERSION: v1.8.2-alpha
  BOOK: 8moves_v3.pgn

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      rounds: ${{ steps.plan.outputs.rounds }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GAMES: ${{ inputs.games_per_anchor }}
          SHARDS: ${{ inputs.shards }}
          ANCHORS: ${{ inputs.anchors }}
          ANCHORS_FILE: ${{ inputs.anchors_file }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          anchors = json.load(open(os.environ["ANCHORS_FILE"]))["anchors"]
          wanted = os.environ["ANCHORS"].strip()
          if wanted != "all":
              names = {n.strip() for n in wanted.split(",")}
              unknown = names - {a["name"] for a in anchors}
              if unknown:
                  raise SystemExit(f"unknown anchors: {sorted(unknown)}")
              anchors = [a for a in anchors if a["name"] in names]
          shards = int(os.environ["SHARDS"])
          rounds = max(1, int(os.environ["GAMES"]) // (2 * shards))
          include = [dict(a, shard=s, options=" ".join(a["options"]))
                     for a in anchors for s in range(shards)]
          print("matrix=" + json.dumps({"include": include}))
          print(f"rounds={rounds}")
          EOF

  play:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # Background lane: the merge queue's SPRTs use 16 runners, the rest is shared
      # by one background job at a time (ladder, datagen or SPSA).
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }} / shard ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - name: Build rustfish
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          cargo build --release
          printf 'uci\nisready\nposition startpos\ngo depth 4\nquit\n' | ./target/release/rustfish | tail -1
          mkdir -p engines && cp target/release/rustfish engines/rustfish

      - uses: actions/setup-go@v5
        if: matrix.kind == 'go'
        with:
          go-version: stable
          cache: false

      - name: Build ${{ matrix.name }}
        env:
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
          KIND: ${{ matrix.kind }}
          PKG: ${{ matrix.pkg }}
          BIN: ${{ matrix.bin }}
          NAME: ${{ matrix.name }}
          DIR: ${{ matrix.dir }}
          MAKE_ARGS: ${{ matrix.make_args }}
          OUT: ${{ matrix.out }}
          NET_URL: ${{ matrix.net_url }}
          NET_SHA256: ${{ matrix.net_sha256 }}
          NET_PATH: ${{ matrix.net_path }}
        run: |
          git clone --quiet --depth 1 --branch "$REF" "https://github.com/$REPO.git" anchor-src
          # Nets kept outside the anchor's repo: commit-pinned URL plus sha256, so a
          # missing or swapped net fails here rather than playing silently weak.
          if [ -n "$NET_URL" ]; then
            mkdir -p "$(dirname "anchor-src/$NET_PATH")"
            curl -sSfL -o "anchor-src/$NET_PATH" "$NET_URL"
            echo "$NET_SHA256  anchor-src/$NET_PATH" | sha256sum -c -
          fi
          case "$KIND" in
            stash) make -C anchor-src/src -j"$(nproc)" EXE=anchor && cp anchor-src/src/anchor "engines/$NAME" ;;
            # MAKE_ARGS is intentionally unquoted: it holds a target and VAR=value words.
            make)  make -C "anchor-src/$DIR" -j"$(nproc)" $MAKE_ARGS && cp "anchor-src/$OUT" "engines/$NAME" ;;
            go)    (cd anchor-src && go build -o "../engines/$NAME" "$PKG") ;;
            cargo) RUSTFLAGS="-C target-cpu=native" cargo build --release --manifest-path anchor-src/Cargo.toml -p "$PKG" \
                     && cp "anchor-src/target/release/$BIN" "engines/$NAME" ;;
            # Official Stockfish; the build downloads its NNUE net. Strength is set via
            # options in the anchor file (UCI_LimitStrength/UCI_Elo).
            stockfish) make -C anchor-src/src -j"$(nproc)" build ARCH=x86-64-avx2 \
                     && cp anchor-src/src/stockfish "engines/$NAME" ;;
            *)     echo "unknown kind $KIND"; exit 1 ;;
          esac
          # Sleep before quit so threaded searchers answer; grep the captured
          # output rather than piping, so an early grep exit can't SIGPIPE the engine.
          out=$( (printf 'uci\nisready\nucinewgame\nisready\nposition startpos\ngo depth 4\n'; sleep 2; printf 'quit\n') | "engines/$NAME" 2>&1 )
          grep bestmove <<<"$out" || { echo "no bestmove; engine said:"; echo "$out"; exit 1; }

      - name: Fetch fastchess and openings
        run: |
          curl -sSL -o fastchess.tar "https://github.com/Disservin/fastchess/releases/download/$FASTCHESS_VERSION/fastchess-linux-x86-64.tar"
          mkdir fastchess-dist && tar -xf fastchess.tar -C fastchess-dist
          install -m 755 "$(find fastchess-dist -type f -name fastchess | head -1)" engines/fastchess
          curl -sSL -o book.zip "https://github.com/official-stockfish/books/raw/master/$BOOK.zip"
          unzip -q book.zip
          engines/fastchess -version

      - name: Play ${{ needs.plan.outputs.rounds }} rounds at ${{ inputs.tc }}
        env:
          NAME: ${{ matrix.name }}
          OPTIONS: ${{ matrix.options }}
          ROUNDS: ${{ needs.plan.outputs.rounds }}
          TC: ${{ inputs.tc }}
          SEED: ${{ github.run_id }}${{ matrix.shard }}
        run: |
          # OPTIONS is intentionally unquoted: it holds space-separated option.X=Y words.
          engines/fastchess \
            -engine cmd=engines/rustfish name=rustfish option.OwnBook=false \
            -engine cmd="engines/$NAME" name="$NAME" $OPTIONS \
            -each proto=uci tc="$TC" option.Hash=64 \
            -rounds "$ROUNDS" -repeat \
            -concurrency "$(nproc)" \
            -openings file="$BOOK" format=pgn order=random \
            -srand "$SEED" \
            -draw movenumber=40 movecount=8 score=10 \
            -resign movecount=3 score=600 \
            -recover \
            -pgnout file="games-$NAME-${{ matrix.shard }}.pgn" \
            -ratinginterval 10

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-${{ matrix.name }}-${{ matrix.shard }}
          path: games-*.pgn
          if-no-files-found: warn

  report:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: games-*
          path: games
          merge-multiple: true
      - name: Fit rating
        run: |
          {
            echo "Commit \`${GITHUB_SHA::7}\`, tc ${{ inputs.tc }}, book $BOOK."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ccrl_ladder.py --anchors "${{ inputs.anchors_file }}" \
            --summary "$GITHUB_STEP_SUMMARY" --json results.json games/*.pgn
          cat games/*.pgn > all-games.pgn
      - uses: actions/upload-artifact@v4
        with:
          name: ccrl-ladder-results
          path: |
            results.json
            all-games.pgn
      - name: Log the result and call the queue back
        if: ${{ always() && inputs.test_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ID: ${{ inputs.test_id }}
          ANCHORS_FILE: ${{ inputs.anchors_file }}
          TC: ${{ inputs.tc }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, subprocess
          tid = os.environ["TEST_ID"]
          res = {"test_id": tid, "status": "broken", "final": True}
          if os.path.exists("results.json"):
              fit = json.load(open("results.json"))
              row = dict(fit, anchors_file=os.environ["ANCHORS_FILE"], tc=os.environ["TC"],
                         sha=os.environ["GITHUB_SHA"][:7], url=os.environ["URL"],
                         logged_at=datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d-%H%M"),
                         note=f"automatic ladder from the merge queue ({tid})")
              git = lambda *a: subprocess.run(["git", *a], check=True)
              git("config", "user.name", "rustfish-queue")
              git("config", "user.email", "rustfish-queue@users.noreply.github.com")
              for attempt in range(5):
                  git("fetch", "-q", "origin", "main")
                  git("checkout", "-q", "-B", "main", "origin/main")
                  with open("tests/ladder-log.jsonl", "a") as fh:
                      fh.write(json.dumps(row, sort_keys=True) + "\n")
                  git("commit", "-q", "-am", f"Log CCRL ladder: ~{fit['rating']:.0f} on {row['sha']} ({tid})")
                  if subprocess.run(["git", "push", "-q", "origin", "main"]).returncode == 0:
                      break
              res = {"test_id": tid, "status": "ladder", "final": True, "rating": fit.get("rating"),
                     "ci": fit.get("ci"), "games": fit.get("games")}
          subprocess.run(["gh", "workflow", "run", "queue.yml", "--ref", "main",
                          "-f", f"result={json.dumps(res)}"], check=True)
          EOF
