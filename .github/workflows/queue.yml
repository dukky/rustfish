name: Merge queue

# Serial merge queue (scripts/queue.py). Rebases the next candidate onto main,
# checks it, and launches its SPRT; sprt.yml calls back here with the final
# result, and passing candidates are fast-forwarded into main. State and log
# live on the `queue-state` branch. Start or resume with:
#   gh workflow run queue.yml
# Add work with `python3 scripts/queue.py add branch:stc,other:speedup [--front]`
# (writes a request file to queue-state's inbox/; never pass work as workflow
# inputs, since GitHub cancels all but one pending run per concurrency group).
# The schedule is a heartbeat: it picks up inbox requests and, if a callback was
# lost, finds the current test's final result itself. datagen.yml also calls
# back when a run ends, so the background lane gets its next seed at once.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      result:
        description: "Final SPRT result JSON (sent by sprt.yml; leave empty to start/resume)"
        default: ""
      finished_run:
        description: "Run id of a background-lane run that is calling back as it ends (sent by datagen.yml)"
        default: ""

concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  contents: write   # push rebased candidates, fast-forward main, update queue-state
  actions: write    # dispatch sprt.yml

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Advance the queue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ inputs.result }}
          FINISHED_RUN: ${{ inputs.finished_run }}
        run: |
          git config user.name "rustfish-queue"
          git config user.email "rustfish-queue@users.noreply.github.com"
          python3 scripts/queue.py advance
