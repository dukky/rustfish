name: Train sweep

# One-variable NNUE experiments in parallel: one shared, shuffled pool built
# once (prep), one variant per runner (train), one table (report). Every
# variant is scored on the laptop's two validation sets: val.bin (last 1M of
# seed 9) and val17x2 (last 1M of seed 17, x2), both cut from training.
# Helpers and details: scripts/train_sweep.py; usage: docs/nnue-experiments.md
# ("CI training sweeps").
#
# Runners: sweeps use the same 20 runners as the queue. With the lanes in
# scripts/queue-settings.json (13 background datagen + 6 foreground + 1
# queue job) a sweep at max_parallel 6 takes the whole foreground lane, so
# SPRTs wait behind it. Dispatch when the queue is light, or lower
# lanes.background_parallel for the duration.

run-name: "Train sweep ${{ inputs.name }}"

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Sweep name (run title, artifact names)"
        required: true
      seeds:
        description: 'Training seeds: JSON list of seeds / "A-B" ranges / "all" (newest successful datagen run each; seed 7 quarantined), or JSON {seed: run id}. E.g. ["8-29"]'
        required: true
      variants:
        description: 'JSON list of {"name", "args", "init": true}; --data/--val/--out/--threads/--checkpoint/--keep-best (and --init when init_net is set and init is true) are added'
        required: true
      positions:
        description: "Pool size cap in positions (evenly spaced blocks of every seed, then shuffled); 0 = all. Default 300M = 9.6 GB artifact"
        default: "300000000"
      init_net:
        description: 'Warm-start net: <ref>:<path> (e.g. main:net/nnue.bin), https URL, or run:<run id>:<artifact>:<file>; empty = none'
        default: ""
      init_args:
        description: "Eval args for the init net's reference row (its shape)"
        default: "--buckets 8"
      max_parallel:
        description: "Variant jobs at once (6 = the whole foreground lane)"
        default: "6"
      train_minutes:
        description: "Training wall-clock limit per variant (job limit 6 h; the best finished epoch is kept)"
        default: "320"
      ref:
        description: "Repo ref for the trainer source"
        default: "main"
      x2_seeds:
        description: "Half-scale seeds whose scores are doubled"
        default: "14-18"

permissions:
  contents: read
  actions: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: trainer-src
      - id: plan
        env:
          VARIANTS: ${{ inputs.variants }}
        run: echo "variants=$(python3 scripts/train_sweep.py plan --variants "$VARIANTS")" >> "$GITHUB_OUTPUT"
      - name: Build trainer
        run: |
          # Kernels dispatch AVX-512/AVX2 at runtime; v3 baseline runs on every runner.
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release --manifest-path trainer-src/tools/nnue-trainer/Cargo.toml
          cargo test --release --manifest-path trainer-src/tools/nnue-trainer/Cargo.toml
      - name: Build the pool and validation sets
        env:
          GH_TOKEN: ${{ github.token }}
          SEEDS: ${{ inputs.seeds }}
          POSITIONS: ${{ inputs.positions }}
          X2: ${{ inputs.x2_seeds }}
        run: |
          # /mnt has ~70 GB on hosted runners; the root disk does not.
          sudo mkdir -p /mnt/w /mnt/sweep && sudo chown "$USER" /mnt/w /mnt/sweep
          cp trainer-src/tools/nnue-trainer/target/release/nnue-trainer /mnt/sweep/
          df -h /mnt
          python3 scripts/train_sweep.py pool --seeds "$SEEDS" --positions "$POSITIONS" --x2-seeds "$X2" \
            --trainer /mnt/sweep/nnue-trainer --work /mnt/w --dest /mnt/sweep | tee /mnt/w/manifest.out
          { echo '### Pool'; echo '```json'; cat /mnt/sweep/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch the warm-start net
        if: inputs.init_net != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INIT: ${{ inputs.init_net }}
          INIT_ARGS: ${{ inputs.init_args }}
        run: |
          python3 scripts/train_sweep.py init --spec "$INIT" --out /mnt/sweep/init.bin | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/train_sweep.py evalnet --name "init: $INIT" --net /mnt/sweep/init.bin --args "$INIT_ARGS" \
            --trainer /mnt/sweep/nnue-trainer --val /mnt/sweep/val.bin --val17 /mnt/sweep/val17x2.bin \
            --json /mnt/sweep/init.json
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-data-${{ inputs.name }}
          path: /mnt/sweep
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ inputs.name }}-_prep
          path: |
            /mnt/sweep/manifest.json
            /mnt/sweep/init.json
          if-no-files-found: ignore
          retention-days: 14

  train:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        variant: ${{ fromJSON(needs.prep.outputs.variants) }}
    name: train ${{ matrix.variant.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Prepare /mnt
        run: sudo mkdir -p /mnt/sweep /mnt/out && sudo chown "$USER" /mnt/sweep /mnt/out
      - uses: actions/download-artifact@v4
        with:
          name: sweep-data-${{ inputs.name }}
          path: /mnt/sweep
      - name: Train
        env:
          NAME: ${{ matrix.variant.name }}
          ARGS: ${{ matrix.variant.args }}
          USE_INIT: ${{ matrix.variant.init && inputs.init_net != '' }}
          MINUTES: ${{ inputs.train_minutes }}
        run: |
          chmod +x /mnt/sweep/nnue-trainer
          lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-200
          INIT=""
          [ "$USE_INIT" = true ] && INIT="--init /mnt/sweep/init.bin"
          O=/mnt/out
          set +e
          # SIGINT at the limit; the epoch nets and the checkpoint (for --resume)
          # of every finished epoch are kept and uploaded.
          timeout --signal=INT --kill-after=60 $((MINUTES * 60)) /mnt/sweep/nnue-trainer train \
            --data /mnt/sweep/pool.bin --val /mnt/sweep/val.bin --out "$O/$NAME.bin" \
            --checkpoint "$O/$NAME.ckpt" --threads "$(nproc)" --keep-best $INIT $ARGS 2>&1 | tee "$O/$NAME.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "trainer exit $rc"
          python3 scripts/train_sweep.py finish --name "$NAME" --args "$ARGS" $( [ -n "$INIT" ] && echo --init ) \
            --rc "$rc" --log "$O/$NAME.log" --net "$O/$NAME.bin" --trainer /mnt/sweep/nnue-trainer \
            --val /mnt/sweep/val.bin --val17 /mnt/sweep/val17x2.bin --json "$O/$NAME.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ inputs.name }}-${{ matrix.variant.name }}
          path: /mnt/out
          retention-days: 14

  report:
    needs: [prep, train]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-${{ inputs.name }}-*
          path: results
      - name: Summarise
        run: python3 scripts/train_sweep.py report --dir results | tee -a "$GITHUB_STEP_SUMMARY"
