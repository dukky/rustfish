[package]
name = "nnue-trainer-cuda"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[[bin]]
name = "nnue-trainer-cuda"
path = "src/main.rs"

[features]
# H1 = 32 heads (nnue-trainer's `h1-32`; the kernels get -DH1=32).
h1-32 = ["nnue-trainer/h1-32"]

[dependencies]
nnue-trainer = { path = "../nnue-trainer" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
