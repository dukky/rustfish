[package]
name = "nnue-trainer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
# H1 = 32 head (L1 width) instead of 16: a separate binary, another net format.
h1-32 = []

[[bin]]
name = "nnue-trainer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
